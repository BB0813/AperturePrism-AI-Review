name: Docker CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # No APERTUREPRISM_INTEGRATION_DATABASE_URL set: DB integration tests auto-skip.
        run: npm run test

      - name: Web UI tests
        # apps/web is an independent workspace; install and run its tests here.
        working-directory: apps/web
        run: |
          npm ci
          npm test

  build-and-push:
    name: Build & push (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, analysis-worker, index-worker, scheduler, scan-worker, qq-bot, migrate, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bb0813/apertureprism-ai-review/${{ matrix.target }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    needs: build-and-push
    # 仅在 push 语义化版本 tag（v*）时自动创建 GitHub Release，
    # 让 Releases 页始终展示最新包与 tag（此前只推镜像，Releases 停在旧版本）。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git tag --sort=-version:refname | grep -v '^v0\.' | sed -n '2p')
          if [ -z "$PREV" ]; then PREV=""; fi
          {
            echo "## $TAG"
            echo ""
            echo "镜像已推送 GHCR：\`ghcr.io/bb0813/apertureprism-ai-review/<svc>:$TAG\`"
            echo ""
            echo "### 变更"
            if [ -n "$PREV" ]; then
              git log --oneline --no-merges "$PREV".."$TAG"
            else
              git log --oneline --no-merges -10
            fi
          } > /tmp/release-body.md
          cat /tmp/release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: false

      # 闭环：release 由 GITHUB_TOKEN 创建时，release.published 事件会被 GitHub
      # 静默吞掉（GITHUB_TOKEN 触发的事件不会新建 workflow run，workflow_dispatch 除外）。
      # 因此 release 创建成功后显式用 workflow_dispatch 触发更新日志重新生成 + 部署。
      - name: Trigger changelog regeneration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Generate & deploy changelog" --ref main
