# AperturePrism web reverse proxy: serves the built SPA and forwards all API,
# OAuth/webhook and SSE traffic to the `api` service on the same origin so the
# browser never needs CORS and EventSource works.

# Compress text-ish payloads (JS/CSS bundles, JSON) to cut transfer size.
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_types
    application/javascript
    application/json
    application/xml
    text/css
    text/plain
    text/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA (hash routing): serve the shell for unknown non-API paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 是 SPA 入口壳：永远 no-cache。它引用带内容 hash 的 JS/CSS，
    # 浏览器每次重取壳即可拿到最新版本，避免「旧壳 + 旧接口」的缓存组合
    # （#15「点击已安装仓库报错」的根因之一）。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed static assets (Vite emits content-hashed filenames): long cache.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + SSE + webhook + OAuth: forward to the API container.
    location ~ ^/(auth|setup|health|tasks|summary|results|providers|repositories|logs|vector|config|settings|events|index|backup|label-rules|memory|capabilities|users|audit|github|update|scans|metrics|alerts|bot)(/|$) {
        proxy_pass http://api:30001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # SSE: never buffer or cache the stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        # 在线更新是长时 SSE 流：pull 镜像可能要几分钟。默认 90s 会在静默期
        # 掐断连接，浏览器报 "network error"。放宽到 10 分钟兜底。
        proxy_read_timeout 600s;
    }

    # 网关级错误（api 容器正在重建 / 尚未就绪）：返回可读 JSON 而非裸 502 页，
    # 便于前端与用户判断是"服务重启中"而不是应用崩溃。
    error_page 502 503 504 = @gateway_down;
    location @gateway_down {
        default_type application/json;
        return 503 '{"status":"error","reason":"api_unavailable","hint":"服务正在重启，请稍后刷新页面"}';
    }
}
