# AperturePrism web reverse proxy: serves the built SPA and forwards all API,
# OAuth/webhook and SSE traffic to the `api` service on the same origin so the
# browser never needs CORS and EventSource works.

# Compress text-ish payloads (JS/CSS bundles, JSON) to cut transfer size.
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_types
    application/javascript
    application/json
    application/xml
    text/css
    text/plain
    text/xml
    image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA (hash routing): serve the shell for unknown non-API paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed static assets (Vite emits content-hashed filenames): long cache.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + SSE + webhook + OAuth: forward to the API container.
    location ~ ^/(auth|setup|health|tasks|summary|results|providers|repositories|logs|vector|config|settings|events|index|backup|label-rules|memory|capabilities|users|audit|github|update|scans)(/|$) {
        proxy_pass http://api:30001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # SSE: never buffer or cache the stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }
}
