# 本地开发数据库（postgres+redis）。项目名与生产一致，容器名统一 AperturePrism-AI-Review-*。
name: AperturePrism-AI-Review
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: apertureprism
      POSTGRES_USER: apertureprism
      POSTGRES_PASSWORD: apertureprism
    ports:
      - "5432:5432"
    volumes:
      - apertureprism-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apertureprism"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - apertureprism-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  apertureprism-postgres:
  apertureprism-redis:
