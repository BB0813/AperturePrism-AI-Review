# Production deployment. Secrets come from .env.production (never committed).
#   本文件与 .env.production 需在同一目录（docker/），service 级 env_file 相对本文件解析。
#   cp .env.example docker/.env.production           # 填 DATABASE_URL/REDIS_URL/CREDENTIAL_MASTER_KEY/GITHUB_*/EMBEDDING_*
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.production run --rm migrate   # 一次性应用迁移
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.production up -d              # 启动全栈
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.production --profile qq up -d  # 含 QQ 机器人
# Web 通过 nginx 与 API 同源：http://<host>:${WEB_PORT:-80}
#
# 镜像从 GHCR 拉取（CI 发布）：ghcr.io/bb0813/apertureprism-ai-review/<target>
#   IMAGE_TAG 默认 latest；打 tag 发布后可固定版本，如 IMAGE_TAG=v0.1.0。
# 本地源码构建：docker compose -f docker/docker-compose.prod.yml -f docker/docker-compose.build.yml up -d --build
# 本地开发数据库：docker compose -f docker/docker-compose.dev.yml up -d（只起 postgres+redis）
#
# 项目名固定为 AperturePrism-AI-Review：容器名/网络名统一为 AperturePrism-AI-Review-*
# （而不是默认取目录名）。已有旧部署需先 down 再 up 才能生效：
#   docker compose ... down && docker compose ... up -d
name: AperturePrism-AI-Review
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # 兜住异常暴涨：小 VPS 上任一进程吃满内存会挤占整机，表现为 SSH 时断时续。
    # 用顶层 mem_limit/cpus 而非 deploy.resources —— 后者只在 Swarm 生效，docker compose up 会静默忽略。
    mem_limit: 768M
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apertureprism}
      POSTGRES_USER: ${POSTGRES_USER:-apertureprism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - apertureprism-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apertureprism}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 兜住异常暴涨：小 VPS 上任一进程吃满内存会挤占整机，表现为 SSH 时断时续。
    # 用顶层 mem_limit/cpus 而非 deploy.resources —— 后者只在 Swarm 生效，docker compose up 会静默忽略。
    mem_limit: 192M
    cpus: 0.5
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - apertureprism-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/bb0813/apertureprism-ai-review/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 兜住异常暴涨：小 VPS 上任一进程吃满内存会挤占整机，表现为 SSH 时断时续。
    # 用顶层 mem_limit/cpus 而非 deploy.resources —— 后者只在 Swarm 生效，docker compose up 会静默忽略。
    mem_limit: 512M
    cpus: 1.0
    env_file: .env.production
    environment:
      HOST: 0.0.0.0
      PORT: 30001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # 在线更新：当前运行版本 / 项目名 / 是否叠加 verify 网络 override（NAS 地址池耗尽场景）
      UPDATE_VERSION: ${IMAGE_TAG:-latest}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-apertureprism-ai-review}
      AP_VERIFY: ${AP_VERIFY:-0}
      # OAuth 回调地址（反代/TLS 终结时需显式指定，避免按 Host 推导错误）
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
    volumes:
      # 供在线更新（POST /update/apply）驱动 docker compose；只读、脚本白名单限定本项目
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${GITHUB_APP_KEY_MOUNT:-/opt/apertureprism/github-app.pem}:/opt/apertureprism/github-app.pem:ro
    # API 只绑定 loopback：Web 走 docker 内部网络 (http://api:30001) 反代，
    # 宿主端口仅供本机/内网运维直连，避免公网绕过 nginx 直接改配置/密钥。
    ports:
      - "127.0.0.1:${API_PORT:-30001}:30001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analysis-worker:
    image: ghcr.io/bb0813/apertureprism-ai-review/analysis-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 兜住异常暴涨：小 VPS 上任一进程吃满内存会挤占整机，表现为 SSH 时断时续。
    # 用顶层 mem_limit/cpus 而非 deploy.resources —— 后者只在 Swarm 生效，docker compose up 会静默忽略。
    mem_limit: 768M
    cpus: 1.0
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ${GITHUB_APP_KEY_MOUNT:-/opt/apertureprism/github-app.pem}:/opt/apertureprism/github-app.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  index-worker:
    image: ghcr.io/bb0813/apertureprism-ai-review/index-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 兜住异常暴涨：小 VPS 上任一进程吃满内存会挤占整机，表现为 SSH 时断时续。
    # 用顶层 mem_limit/cpus 而非 deploy.resources —— 后者只在 Swarm 生效，docker compose up 会静默忽略。
    mem_limit: 768M
    cpus: 1.0
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      INDEX_INTERVAL_MS: ${INDEX_INTERVAL_MS:-600000}
    volumes:
      - ${GITHUB_APP_KEY_MOUNT:-/opt/apertureprism/github-app.pem}:/opt/apertureprism/github-app.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    image: ghcr.io/bb0813/apertureprism-ai-review/scheduler:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 兜住异常暴涨：小 VPS 上任一进程吃满内存会挤占整机，表现为 SSH 时断时续。
    # 用顶层 mem_limit/cpus 而非 deploy.resources —— 后者只在 Swarm 生效，docker compose up 会静默忽略。
    mem_limit: 256M
    cpus: 0.5
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy

  scan-worker:
    image: ghcr.io/bb0813/apertureprism-ai-review/scan-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 兜住异常暴涨：小 VPS 上任一进程吃满内存会挤占整机，表现为 SSH 时断时续。
    # 用顶层 mem_limit/cpus 而非 deploy.resources —— 后者只在 Swarm 生效，docker compose up 会静默忽略。
    mem_limit: 384M
    cpus: 0.5
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-60000}
    volumes:
      - ${GITHUB_APP_KEY_MOUNT:-/opt/apertureprism/github-app.pem}:/opt/apertureprism/github-app.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot migration runner: docker compose ... run --rm migrate
  migrate:
    image: ghcr.io/bb0813/apertureprism-ai-review/migrate:${IMAGE_TAG:-latest}
    restart: "no"
    # 兜住异常暴涨：小 VPS 上任一进程吃满内存会挤占整机，表现为 SSH 时断时续。
    # 用顶层 mem_limit/cpus 而非 deploy.resources —— 后者只在 Swarm 生效，docker compose up 会静默忽略。
    mem_limit: 256M
    cpus: 0.5
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # Web console (nginx): serves the SPA and proxies API/SSE to `api`.
  web:
    image: ghcr.io/bb0813/apertureprism-ai-review/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 兜住异常暴涨：小 VPS 上任一进程吃满内存会挤占整机，表现为 SSH 时断时续。
    # 用顶层 mem_limit/cpus 而非 deploy.resources —— 后者只在 Swarm 生效，docker compose up 会静默忽略。
    mem_limit: 128M
    cpus: 0.5
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

  # Optional QQ bot (onebot11/satori/milky or official api-v2).
  qq-bot:
    image: ghcr.io/bb0813/apertureprism-ai-review/qq-bot:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 兜住异常暴涨：小 VPS 上任一进程吃满内存会挤占整机，表现为 SSH 时断时续。
    # 用顶层 mem_limit/cpus 而非 deploy.resources —— 后者只在 Swarm 生效，docker compose up 会静默忽略。
    mem_limit: 256M
    cpus: 0.5
    profiles: ["qq"]
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  apertureprism-postgres:
  apertureprism-redis:
